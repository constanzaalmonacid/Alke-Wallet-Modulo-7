{% load static %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alke Wallet | Coni</title><link rel="stylesheet" href="{% static 'gestion/css/style.css' %}"></head>
<body><header class="barra"><a class="logo" href="{% url 'inicio' %}">♡ Alke Wallet</a>
{% if user.is_authenticated %}<nav><a href="{% url 'inicio' %}">Inicio</a><a href="{% url 'cliente_list' %}">Clientes</a><a href="{% url 'cuenta_list' %}">Billeteras</a><a href="{% url 'movimientos' %}">Movimientos</a><a href="{% url 'reporte' %}">Reportes</a></nav>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="salir" type="submit">Salir</button></form>{% endif %}</header>
<main class="contenedor">{% for mensaje in messages %}<div class="aviso">{{ mensaje }}</div>{% endfor %}{% block contenido %}{% endblock %}</main>
<footer> Proyecto Módulo 7 · 2026</footer></body></html>
